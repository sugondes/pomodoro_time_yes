<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Pomodoro Timer</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ children, className }) => (
      <span className={className} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }}>{children}</span>
    );
    const Play = (props) => <Icon {...props}>▶</Icon>;
    const Pause = (props) => <Icon {...props}>❚❚</Icon>;
    const RotateCcw = (props) => <Icon {...props}>↺</Icon>;
    const Settings = (props) => <Icon {...props}>⚙</Icon>;
    const Plus = (props) => <Icon {...props}>+</Icon>;
    const Trash2 = (props) => <Icon {...props}>✕</Icon>;
    const Edit2 = (props) => <Icon {...props}>✎</Icon>;
    const Save = (props) => <Icon {...props}>✓</Icon>;
    const X = (props) => <Icon {...props}>✕</Icon>;
    const ChevronRight = (props) => <Icon {...props}>›</Icon>;

    function PomodoroTimer() {
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);
      const [currentPeriodIndex, setCurrentPeriodIndex] = useState(0);
      const [completedCycles, setCompletedCycles] = useState(0);
      const [showRoutines, setShowRoutines] = useState(false);
      const [editingRoutine, setEditingRoutine] = useState(null);
      const audioRef = useRef(null);

      const defaultRoutines = [
        {
          id: 'classic',
          name: 'CLASSIC POMODORO',
          icon: '●',
          periods: [
            { name: 'FOCUS', duration: 25 },
            { name: 'SHORT BREAK', duration: 5 },
            { name: 'FOCUS', duration: 25 },
            { name: 'SHORT BREAK', duration: 5 },
            { name: 'FOCUS', duration: 25 },
            { name: 'SHORT BREAK', duration: 5 },
            { name: 'FOCUS', duration: 25 },
            { name: 'LONG BREAK', duration: 15 }
          ]
        },
        {
          id: 'simple',
          name: 'SIMPLE TIMER',
          icon: '▲',
          periods: [
            { name: 'WORK', duration: 30 },
            { name: 'BREAK', duration: 10 }
          ]
        },
        {
          id: 'study',
          name: 'STUDY SESSION',
          icon: '■',
          periods: [
            { name: 'STUDY', duration: 45 },
            { name: 'REVIEW', duration: 10 },
            { name: 'BREAK', duration: 15 }
          ]
        }
      ];

      const [routines, setRoutines] = useState(() => {
        const stored = localStorage.getItem('pomodoro-routines-v2');
        return stored ? JSON.parse(stored) : defaultRoutines;
      });

      const [activeRoutine, setActiveRoutine] = useState(() => {
        const stored = localStorage.getItem('pomodoro-active-routine-v2');
        return stored ? JSON.parse(stored) : routines[0];
      });

      const [remainingMinutes, setRemainingMinutes] = useState(activeRoutine.periods[0].duration);

      useEffect(() => {
        localStorage.setItem('pomodoro-routines-v2', JSON.stringify(routines));
      }, [routines]);

      useEffect(() => {
        localStorage.setItem('pomodoro-active-routine-v2', JSON.stringify(activeRoutine));
      }, [activeRoutine]);

      useEffect(() => {
        let interval = null;
        if (isActive) {
          interval = setInterval(() => {
            if (seconds === 0) {
              if (remainingMinutes === 0) {
                playSound();
                setIsActive(false);
                
                const nextIndex = (currentPeriodIndex + 1) % activeRoutine.periods.length;
                if (nextIndex === 0) {
                  setCompletedCycles(completedCycles + 1);
                }
                setCurrentPeriodIndex(nextIndex);
                setRemainingMinutes(activeRoutine.periods[nextIndex].duration);
                setSeconds(0);
              } else {
                setRemainingMinutes(remainingMinutes - 1);
                setSeconds(59);
              }
            } else {
              setSeconds(seconds - 1);
            }
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, remainingMinutes, seconds, currentPeriodIndex, activeRoutine, completedCycles]);

      const playSound = () => {
        if (audioRef.current) {
          audioRef.current.play().catch(e => console.log('Audio play failed:', e));
        }
      };

      const toggleTimer = () => {
        setIsActive(!isActive);
      };

      const resetTimer = () => {
        setIsActive(false);
        setRemainingMinutes(activeRoutine.periods[currentPeriodIndex].duration);
        setSeconds(0);
      };

      const skipPeriod = () => {
        setIsActive(false);
        const nextIndex = (currentPeriodIndex + 1) % activeRoutine.periods.length;
        if (nextIndex === 0) {
          setCompletedCycles(completedCycles + 1);
        }
        setCurrentPeriodIndex(nextIndex);
        setRemainingMinutes(activeRoutine.periods[nextIndex].duration);
        setSeconds(0);
      };

      const formatTime = (mins, secs) => {
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const currentPeriod = activeRoutine.periods[currentPeriodIndex];
      const progress = ((currentPeriod.duration * 60 - (remainingMinutes * 60 + seconds)) / (currentPeriod.duration * 60)) * 100;

      const selectRoutine = (routine) => {
        setActiveRoutine(routine);
        setIsActive(false);
        setCurrentPeriodIndex(0);
        setRemainingMinutes(routine.periods[0].duration);
        setSeconds(0);
        setCompletedCycles(0);
        setShowRoutines(false);
      };

      const addRoutine = () => {
        const routine = {
          id: Date.now().toString(),
          name: 'NEW ROUTINE',
          icon: '●',
          periods: [
            { name: 'WORK', duration: 25 },
            { name: 'BREAK', duration: 5 }
          ]
        };
        setRoutines([...routines, routine]);
        setEditingRoutine(routine);
      };

      const deleteRoutine = (id) => {
        if (routines.length <= 1) return;
        const filtered = routines.filter(r => r.id !== id);
        setRoutines(filtered);
        if (activeRoutine.id === id) {
          selectRoutine(filtered[0]);
        }
        if (editingRoutine?.id === id) {
          setEditingRoutine(null);
        }
      };

      const startEditRoutine = (routine) => {
        setEditingRoutine(JSON.parse(JSON.stringify(routine)));
      };

      const saveEditRoutine = () => {
        if (!editingRoutine.name.trim() || editingRoutine.periods.length === 0) return;
        
        const updated = routines.map(r => 
          r.id === editingRoutine.id ? editingRoutine : r
        );
        setRoutines(updated);
        if (activeRoutine.id === editingRoutine.id) {
          selectRoutine(editingRoutine);
        }
        setEditingRoutine(null);
      };

      const addPeriod = () => {
        if (!editingRoutine) return;
        setEditingRoutine({
          ...editingRoutine,
          periods: [
            ...editingRoutine.periods,
            { name: 'NEW PERIOD', duration: 25 }
          ]
        });
      };

      const updatePeriod = (index, field, value) => {
        const newPeriods = [...editingRoutine.periods];
        newPeriods[index] = { ...newPeriods[index], [field]: value };
        setEditingRoutine({ ...editingRoutine, periods: newPeriods });
      };

      const deletePeriod = (index) => {
        if (editingRoutine.periods.length <= 1) return;
        const newPeriods = editingRoutine.periods.filter((_, i) => i !== index);
        setEditingRoutine({ ...editingRoutine, periods: newPeriods });
      };

      const iconOptions = ['●', '○', '■', '□', '▲', '△', '▼', '▽', '◆', '◇', '★', '☆', '►', '◄'];

      return (
        <div className="min-h-screen bg-black flex items-center justify-center p-4">
          <audio ref={audioRef} src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGGm98OScTgwNUrDn77RiFgg3k9n0yHMpBSl+zPLaizsKGGS65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKGGS65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2S65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHAU2jdXzxnUpBSh+zPDaizsKF2O65+mjUBELTKXh8bllHA==" />
          
          <div className="w-full max-w-2xl">
            {!showRoutines ? (
              <div className="border border-white rounded-3xl p-8">
                <div className="flex items-start justify-between mb-12 border-b border-white pb-4">
                  <div>
                    <h1 className="text-white text-xl tracking-wider mb-1">{activeRoutine.name}</h1>
                    <p className="text-white text-sm tracking-wide">{currentPeriod.name}</p>
                    <p className="text-white opacity-50 text-xs tracking-wide">
                      PERIOD {currentPeriodIndex + 1}/{activeRoutine.periods.length}
                    </p>
                  </div>
                  <button
                    onClick={() => setShowRoutines(true)}
                    className="text-white hover:opacity-50 transition-opacity p-2 rounded-full"
                  >
                    <Settings className="w-5 h-5" />
                  </button>
                </div>

                <div className="mb-12 overflow-x-auto">
                  <div className="flex gap-2 min-w-max">
                    {activeRoutine.periods.map((period, idx) => (
                      <div
                        key={idx}
                        className={`px-3 py-2 border rounded-full text-xs tracking-wider whitespace-nowrap ${
                          idx === currentPeriodIndex
                            ? 'bg-white text-black border-white'
                            : idx < currentPeriodIndex
                            ? 'text-white opacity-30 border-white'
                            : 'text-white border-white opacity-50'
                        }`}
                      >
                        {period.name} {period.duration}M
                      </div>
                    ))}
                  </div>
                </div>

                <div className="text-center mb-12">
                  <div className="text-white text-8xl tracking-wider mb-2" style={{ fontVariantNumeric: 'tabular-nums' }}>
                    {formatTime(remainingMinutes, seconds)}
                  </div>
                  <div className="w-full h-1 bg-white opacity-20 rounded-full mb-4 overflow-hidden">
                    <div 
                      className="h-full bg-white transition-all duration-1000 rounded-full"
                      style={{ width: `${progress}%` }}
                    />
                  </div>
                  <div className="text-white opacity-50 text-xs tracking-wider">
                    CYCLES COMPLETED: {completedCycles}
                  </div>
                </div>

                <div className="flex gap-4 justify-center items-center">
                  <button
                    onClick={toggleTimer}
                    className="w-16 h-16 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all flex items-center justify-center"
                  >
                    {isActive ? <Pause className="w-6 h-6" /> : <Play className="w-6 h-6" />}
                  </button>
                  <button
                    onClick={resetTimer}
                    className="w-16 h-16 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all flex items-center justify-center"
                  >
                    <RotateCcw className="w-6 h-6" />
                  </button>
                  <button
                    onClick={skipPeriod}
                    className="w-16 h-16 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all flex items-center justify-center"
                  >
                    <ChevronRight className="w-6 h-6" />
                  </button>
                </div>
              </div>
            ) : (
              <div className="border border-white rounded-3xl p-8 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-8 border-b border-white pb-4">
                  <h2 className="text-white text-xl tracking-wider">ROUTINES</h2>
                  <button
                    onClick={() => {
                      setShowRoutines(false);
                      setEditingRoutine(null);
                    }}
                    className="text-white hover:opacity-50 transition-opacity p-2 rounded-full"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {!editingRoutine ? (
                  <>
                    <div className="space-y-4 mb-8">
                      {routines.map(routine => (
                        <div
                          key={routine.id}
                          className={`border rounded-2xl p-4 ${
                            activeRoutine.id === routine.id
                              ? 'bg-white text-black border-white'
                              : 'border-white'
                          }`}
                        >
                          <div className="flex items-start justify-between mb-3">
                            <button
                              onClick={() => selectRoutine(routine)}
                              className="flex-1 text-left"
                            >
                              <div className="flex items-center gap-2 mb-1">
                                <span className={`text-sm tracking-wider ${activeRoutine.id === routine.id ? 'text-black' : 'text-white'}`}>
                                  {routine.name}
                                </span>
                              </div>
                              <div className={`text-xs tracking-wide ${activeRoutine.id === routine.id ? 'opacity-50' : 'text-white opacity-50'}`}>
                                {routine.periods.length} PERIODS
                              </div>
                            </button>
                            <div className="flex gap-2">
                              <button
                                onClick={() => startEditRoutine(routine)}
                                className={`p-2 border rounded-full hover:opacity-50 transition-opacity ${
                                  activeRoutine.id === routine.id 
                                    ? 'border-black text-black' 
                                    : 'border-white text-white'
                                }`}
                              >
                                <Edit2 className="w-3 h-3" />
                              </button>
                              {routines.length > 1 && (
                                <button
                                  onClick={() => deleteRoutine(routine.id)}
                                  className={`p-2 border rounded-full hover:opacity-50 transition-opacity ${
                                    activeRoutine.id === routine.id 
                                      ? 'border-black text-black' 
                                      : 'border-white text-white'
                                  }`}
                                >
                                  <Trash2 className="w-3 h-3" />
                                </button>
                              )}
                            </div>
                          </div>
                          <div className="flex gap-1 overflow-x-auto">
                            {routine.periods.map((p, i) => (
                              <div 
                                key={i} 
                                className={`flex-shrink-0 px-2 py-1 border rounded-full text-xs tracking-wide ${
                                  activeRoutine.id === routine.id 
                                    ? 'border-black text-black' 
                                    : 'border-white text-white'
                                }`}
                              >
                                {p.name} {p.duration}M
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={addRoutine}
                      className="w-full py-3 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all text-sm tracking-wider flex items-center justify-center gap-2"
                    >
                      <Plus className="w-4 h-4" /> NEW ROUTINE
                    </button>
                  </>
                ) : (
                  <div className="space-y-6">
                    <div className="border border-white rounded-2xl p-4 space-y-3">
                      <div className="text-white text-sm tracking-wider mb-3">ROUTINE DETAILS</div>
                      <div className="flex gap-2">
                        <select
                          value={editingRoutine.icon}
                          onChange={(e) => setEditingRoutine({...editingRoutine, icon: e.target.value})}
                          className="w-16 p-2 bg-black border border-white rounded-xl text-white text-center text-xl"
                        >
                          {iconOptions.map(icon => (
                            <option key={icon} value={icon}>{icon}</option>
                          ))}
                        </select>
                        <input
                          type="text"
                          value={editingRoutine.name}
                          onChange={(e) => setEditingRoutine({...editingRoutine, name: e.target.value.toUpperCase()})}
                          className="flex-1 p-2 bg-black border border-white rounded-xl text-white tracking-wider text-sm uppercase"
                          placeholder="ROUTINE NAME"
                        />
                      </div>
                    </div>

                    <div className="border border-white rounded-2xl p-4 space-y-3">
                      <div className="flex items-center justify-between mb-3">
                        <div className="text-white text-sm tracking-wider">
                          PERIODS ({editingRoutine.periods.length})
                        </div>
                        <button
                          onClick={addPeriod}
                          className="px-3 py-1 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all text-xs tracking-wider flex items-center gap-1"
                        >
                          <Plus className="w-3 h-3" /> ADD
                        </button>
                      </div>

                      <div className="space-y-2 max-h-96 overflow-y-auto">
                        {editingRoutine.periods.map((period, idx) => (
                          <div key={idx} className="border border-white rounded-xl p-3 space-y-2">
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-white text-xs tracking-wider opacity-50">
                                PERIOD {idx + 1}
                              </span>
                              {editingRoutine.periods.length > 1 && (
                                <button
                                  onClick={() => deletePeriod(idx)}
                                  className="p-1 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all"
                                >
                                  <Trash2 className="w-3 h-3" />
                                </button>
                              )}
                            </div>
                            <input
                              type="text"
                              value={period.name}
                              onChange={(e) => updatePeriod(idx, 'name', e.target.value.toUpperCase())}
                              className="w-full p-2 bg-black border border-white rounded-xl text-white text-xs tracking-wider uppercase"
                              placeholder="PERIOD NAME"
                            />
                            <div>
                              <label className="text-white text-xs tracking-wider opacity-50 block mb-1">
                                DURATION (MINUTES)
                              </label>
                              <input
                                type="number"
                                value={period.duration}
                                onChange={(e) => updatePeriod(idx, 'duration', parseInt(e.target.value) || 1)}
                                className="w-full p-2 bg-black border border-white rounded-xl text-white text-center"
                                min="1"
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={saveEditRoutine}
                        className="flex-1 py-3 bg-white text-black hover:bg-black hover:text-white border border-white rounded-full transition-all text-sm tracking-wider flex items-center justify-center gap-2"
                      >
                        <Save className="w-4 h-4" /> SAVE
                      </button>
                      <button
                        onClick={() => setEditingRoutine(null)}
                        className="flex-1 py-3 border border-white rounded-full text-white hover:bg-white hover:text-black transition-all text-sm tracking-wider"
                      >
                        CANCEL
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<PomodoroTimer />, document.getElementById('root'));
  </script>
</body>
</html>
